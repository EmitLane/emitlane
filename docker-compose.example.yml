services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: emitlane
      POSTGRES_PASSWORD: emitlane
      POSTGRES_DB: emitlane
    ports:
      - "${EMITLANE_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emitlane -d emitlane"]
      interval: 2s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka-native:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${EMITLANE_KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "${EMITLANE_KAFKA_PORT:-19092}:19092"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 3s
      timeout: 5s
      retries: 30

  emitlane-migrate:
    build: .
    command: ["migrate", "up"]
    environment:
      EMITLANE_DATABASE_URL: postgres://emitlane:emitlane@postgres:5432/emitlane?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  emitlane:
    build: .
    command: ["run"]
    environment:
      EMITLANE_DATABASE_URL: postgres://emitlane:emitlane@postgres:5432/emitlane?sslmode=disable
      EMITLANE_KAFKA_BROKERS: kafka:9092
      EMITLANE_KAFKA_AUTO_CREATE_TOPICS: "true"
      EMITLANE_HTTP_ADDR: ":8080"
      EMITLANE_LOG_LEVEL: info
      EMITLANE_ORDERING_REBALANCE_INTERVAL: 2s
      EMITLANE_ORDERING_LEASE_DURATION: 30s
      EMITLANE_ORDERING_SAFETY_MARGIN: 1s
      EMITLANE_ADMIN_ENABLED: "true"
      EMITLANE_ADMIN_ADDR: ":8082"
      EMITLANE_ADMIN_TOKEN: emitlane-local-admin
      EMITLANE_ADMIN_EXPOSE_PAYLOAD: "false"
    ports:
      - "${EMITLANE_HTTP_PORT:-8080}:8080"
      - "${EMITLANE_ADMIN_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      emitlane-migrate:
        condition: service_completed_successfully

  ecommerce:
    build:
      context: .
      dockerfile: examples/ecommerce/Dockerfile
    environment:
      DATABASE_URL: postgres://emitlane:emitlane@postgres:5432/emitlane?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      HTTP_ADDR: ":8081"
      ORDERS_TOPIC: orders.events
    ports:
      - "${ECOMMERCE_HTTP_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      emitlane-migrate:
        condition: service_completed_successfully
      emitlane:
        condition: service_started
