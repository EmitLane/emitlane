# Merge into your existing Prometheus configuration; replace the target addresses.
# Give each logical EmitLane database a different job name beginning with emitlane.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/emitlane/alerts.yml
scrape_configs:
  - job_name: emitlane
    metrics_path: /metrics
    static_configs:
      - targets: [relay-a:8080, relay-b:8080]
# Add your own Alertmanager endpoints before enabling notifications.
