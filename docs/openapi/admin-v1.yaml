openapi: 3.1.0
info:
  title: EmitLane Admin API
  version: 0.9.1
  description: >-
    Contract snapshot for EmitLane v0.9.1 on database schema 4; the route version is /v1.
    Operational API for redacted inspection, relay control, retry, and replay.
    Replay creates a new event identity and can execute downstream business logic again.
    Bearer authentication is required when a token is configured; an
    unauthenticated listener is permitted only on an explicit loopback address.
servers:
  - url: http://127.0.0.1:8081/v1
    description: Standalone loopback listener (when enabled)
  - url: http://127.0.0.1:8082/v1
    description: Docker Compose example (development bearer token required)
tags:
  - { name: Status, description: Queue statistics and read-only integrity }
  - { name: Events, description: Redacted Outbox inspection and same-identity retry }
  - { name: Inbox, description: Managed consumer lifecycle and audited retry }
  - { name: Relays, description: Presence and durable cluster control }
  - { name: Replay, description: New-identity replay and provenance }
  - { name: Ordering, description: Stream cursors and virtual partition ownership }
  - { name: Audit, description: Payload-free operator audit records }
security:
  - bearerAuth: []
  - {}
paths:
  /stats:
    parameters:
      - { $ref: "#/components/parameters/RequestID" }
    get:
      tags: [Status]
      operationId: getStats
      summary: Read durable queue and relay statistics
      responses:
        "200":
          description: Statistics
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /integrity:
    parameters:
      - { $ref: "#/components/parameters/RequestID" }
    get:
      tags: [Status]
      operationId: getIntegrity
      summary: Run a bounded read-only integrity summary
      description: >-
        Uses one repeatable-read, read-only PostgreSQL snapshot. Full verification
        is intentionally CLI-only and blocked streams do not change health endpoints.
      parameters:
        - name: mode
          in: query
          schema: { type: string, enum: [summary], default: summary }
      responses:
        "200":
          description: Bounded integrity report without payloads, headers, or ordering keys
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrityReport" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /inbox/stats:
    parameters:
      - { $ref: "#/components/parameters/RequestID" }
    get:
      tags: [Inbox]
      operationId: getInboxStats
      summary: Read managed Inbox lifecycle statistics
      parameters:
        - { name: consumer, in: query, schema: { type: string, maxLength: 256 } }
      responses:
        "200":
          description: Inbox lifecycle and blocked-partition statistics
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxStats" }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /inbox/dead:
    parameters:
      - { $ref: "#/components/parameters/RequestID" }
    get:
      tags: [Inbox]
      operationId: listDeadInboxEvents
      summary: List dead Inbox records without Kafka payloads
      parameters:
        - { name: consumer, in: query, schema: { type: string, maxLength: 256 } }
        - { $ref: "#/components/parameters/Limit" }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Bounded dead-record page
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema:
                type: object
                required: [items, limit, offset]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/InboxEvent" }
                  limit: { type: integer }
                  offset: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /inbox/events/{id}:
    parameters:
      - { $ref: "#/components/parameters/RequestID" }
      - { $ref: "#/components/parameters/EventID" }
    get:
      tags: [Inbox]
      operationId: getInboxEvent
      summary: Inspect one managed Inbox lifecycle record
      parameters:
        - { name: consumer, in: query, required: true, schema: { type: string, maxLength: 256 } }
      responses:
        "200":
          description: Redacted Inbox lifecycle record
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxEvent" }
        "404": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /inbox/events/{id}/retry:
    parameters:
      - { $ref: "#/components/parameters/RequestID" }
      - { $ref: "#/components/parameters/EventID" }
    post:
      tags: [Inbox]
      operationId: retryInboxEvent
      summary: Explicitly retry one dead Inbox identity
      requestBody:
        description: JSON body, limited to 1 MiB; unknown fields are rejected.
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InboxRetry" }
      responses:
        "200":
          description: Dead identity moved to retry_wait with attempts preserved
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxRetryResult" }
        "409": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /events:
    parameters:
      - { $ref: "#/components/parameters/RequestID" }
    get:
      tags: [Events]
      operationId: listEvents
      summary: List events without payload, key, or headers
      parameters:
        - { $ref: "#/components/parameters/Status" }
        - { name: destination, in: query, schema: { type: string } }
        - { name: event_type, in: query, schema: { type: string } }
        - { name: created_after, in: query, schema: { type: string, format: date-time } }
        - { name: created_before, in: query, schema: { type: string, format: date-time } }
        - { name: replay_batch_id, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Keyset page
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
                  next_cursor: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /events/{id}:
    parameters:
      - { $ref: "#/components/parameters/RequestID" }
      - { $ref: "#/components/parameters/EventID" }
    get:
      tags: [Events]
      operationId: getEvent
      summary: Inspect one event
      description: Payload/key/headers appear only when server exposure and payload=true are both set.
      parameters:
        - name: payload
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Event
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /events/{id}/retry:
    parameters:
      - { $ref: "#/components/parameters/RequestID" }
      - { $ref: "#/components/parameters/EventID" }
    post:
      tags: [Events]
      operationId: retryEvent
      summary: Retry a dead event with the same event ID
      requestBody:
        description: JSON body, limited to 1 MiB; unknown fields are rejected.
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Mutation" }
      responses:
        "200":
          description: Event returned to pending with the same identity and attempts reset
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventRetryResult" }
        "409": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /events/{id}/replay:
    parameters:
      - { $ref: "#/components/parameters/RequestID" }
      - { $ref: "#/components/parameters/EventID" }
    post:
      tags: [Replay]
      operationId: replayEvent
      summary: Create a new event from a delivered or dead event
      requestBody:
        description: JSON body, limited to 1 MiB; unknown fields are rejected.
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderedReplayMutation" }
      responses:
        "201":
          description: Replay created atomically with audit
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplayResult" }
        "409": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /relays:
    parameters:
      - { $ref: "#/components/parameters/RequestID" }
    get:
      tags: [Relays]
      operationId: listRelays
      summary: List active, stale, and stopped relay instances
      responses:
        "200":
          description: Relay instances
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema:
                type: object
                required: [relays]
                properties:
                  relays:
                    type: array
                    items: { $ref: "#/components/schemas/RelayInstance" }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /relays/{id}:
    parameters:
      - { $ref: "#/components/parameters/RequestID" }
    get:
      tags: [Relays]
      operationId: getRelay
      summary: Inspect one relay instance
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, maxLength: 256 }
      responses:
        "200":
          description: Relay instance
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelayInstance" }
        "404": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /relay:
    parameters:
      - { $ref: "#/components/parameters/RequestID" }
    get:
      tags: [Relays]
      operationId: getRelayControl
      summary: Read persisted cluster pause state
      responses:
        "200":
          description: Control state
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Control" }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /relay/pause:
    parameters:
      - { $ref: "#/components/parameters/RequestID" }
    post:
      tags: [Relays]
      operationId: pauseRelay
      summary: Idempotently pause new claims cluster-wide
      requestBody:
        description: JSON body, limited to 1 MiB; unknown fields are rejected.
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Mutation" }
      responses:
        "200":
          description: Updated control state
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Control" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /relay/resume:
    parameters:
      - { $ref: "#/components/parameters/RequestID" }
    post:
      tags: [Relays]
      operationId: resumeRelay
      summary: Idempotently resume new claims cluster-wide
      requestBody:
        description: JSON body, limited to 1 MiB; unknown fields are rejected.
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Mutation" }
      responses:
        "200":
          description: Updated control state
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Control" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /replays/preview:
    parameters:
      - { $ref: "#/components/parameters/RequestID" }
    post:
      tags: [Replay]
      operationId: previewReplay
      summary: Preview a bounded replay selection without mutation
      description: Preview is advisory because retention and new events can change execution membership.
      requestBody:
        description: JSON body, limited to 1 MiB; unknown fields are rejected.
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplayFilter" }
      responses:
        "200":
          description: Count and redacted sample
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplayPreview" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /replays:
    parameters:
      - { $ref: "#/components/parameters/RequestID" }
    post:
      tags: [Replay]
      operationId: createReplayBatch
      summary: Atomically create a bounded replay batch and audit row
      requestBody:
        description: JSON body, limited to 1 MiB; unknown fields are rejected.
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplayRequest" }
      responses:
        "201":
          description: Replay batch created
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplayResult" }
        "409": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /audit:
    parameters:
      - { $ref: "#/components/parameters/RequestID" }
    get:
      tags: [Audit]
      operationId: listAuditRecords
      summary: List payload-free operator audit records
      parameters:
        - { name: action, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Audit page
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema:
                type: object
                required: [records]
                properties:
                  records:
                    type: array
                    items: { $ref: "#/components/schemas/Audit" }
                  next_cursor: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /ordering/streams:
    parameters:
      - { $ref: "#/components/parameters/RequestID" }
    get:
      tags: [Ordering]
      operationId: listOrderingStreams
      summary: List ordered streams and their computed operational state
      parameters:
        - name: state
          in: query
          schema: { type: string, enum: [ready, inflight, retry_wait, gap, dead_blocked] }
        - { name: destination, in: query, schema: { type: string } }
        - { name: partition, in: query, schema: { type: integer, minimum: 0, maximum: 63 } }
        - { name: blocked_only, in: query, schema: { type: boolean, default: false } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/OrderingCursor" }
      responses:
        "200":
          description: Ordered stream keyset page
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OrderingStream" }
                  next_cursor: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /ordering/stream:
    parameters:
      - { $ref: "#/components/parameters/RequestID" }
    get:
      tags: [Ordering]
      operationId: getOrderingStream
      summary: Inspect one ordered stream without exposing event payload
      parameters:
        - { name: destination, in: query, required: true, schema: { type: string } }
        - { name: ordering_key, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Ordered stream
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderingStream" }
        "404": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /ordering/partitions:
    parameters:
      - { $ref: "#/components/parameters/RequestID" }
    get:
      tags: [Ordering]
      operationId: listOrderingPartitions
      summary: List desired and leased virtual-partition ownership
      responses:
        "200":
          description: All 64 virtual ordering partitions
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema:
                type: object
                required: [partitions]
                properties:
                  partitions:
                    type: array
                    items: { $ref: "#/components/schemas/OrderingPartition" }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  headers:
    RequestID:
      description: Correlation ID reused from a valid request header or generated by the server.
      schema: { type: string, maxLength: 128 }
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      description: >-
        Optional correlation ID. After trimming whitespace, a non-empty ASCII
        value without control characters, at most 128 bytes, is reused.
        An invalid or omitted value is replaced with a generated UUID.
      schema: { type: string }
    OrderingCursor:
      name: cursor
      in: query
      description: Opaque ordering-stream keyset cursor from the previous response.
      schema: { type: string, maxLength: 4096 }
    EventID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Status:
      name: status
      in: query
      description: Repeat or comma-separate pending, inflight, delivered, dead.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque keyset cursor from the previous response.
      schema: { type: string, maxLength: 1024 }
  responses:
    Error:
      description: JSON handler error with request correlation ID
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    EventRetryResult:
      type: object
      required: [event_id, status]
      properties:
        event_id: { type: string, format: uuid }
        status: { type: string, enum: [pending] }
    InboxRetryResult:
      type: object
      required: [consumer, event_id, status]
      properties:
        consumer: { type: string }
        event_id: { type: string, format: uuid }
        status: { type: string, enum: [retry_wait] }
    InboxStats:
      type: object
      required: [processed, pending, inflight, retry_wait, dead, stale_inflight, due_retries, blocked_partitions]
      properties:
        processed: { type: integer, format: int64, minimum: 0 }
        pending: { type: integer, format: int64, minimum: 0 }
        inflight: { type: integer, format: int64, minimum: 0 }
        retry_wait: { type: integer, format: int64, minimum: 0 }
        dead: { type: integer, format: int64, minimum: 0 }
        stale_inflight: { type: integer, format: int64, minimum: 0 }
        due_retries: { type: integer, format: int64, minimum: 0 }
        blocked_partitions: { type: integer, format: int64, minimum: 0 }
    InboxEvent:
      type: object
      required: [consumer, event_id, status, attempts, available_at, first_seen_at, updated_at]
      properties:
        consumer: { type: string }
        event_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, inflight, retry_wait, processed, dead] }
        attempts: { type: integer, minimum: 0 }
        available_at: { type: string, format: date-time }
        lease_owner: { type: string }
        lease_until: { type: string, format: date-time }
        last_error: { type: string }
        first_seen_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        processed_at: { type: string, format: date-time }
        source_topic: { type: string }
        source_partition: { type: integer, format: int32, minimum: 0 }
        source_offset: { type: integer, format: int64, minimum: 0 }
        source_timestamp: { type: string, format: date-time }
    InboxRetry:
      type: object
      additionalProperties: false
      required: [consumer, reason]
      properties:
        consumer: { type: string, minLength: 1, maxLength: 256 }
        reason: { type: string, minLength: 1, maxLength: 4096 }
    IntegrityReport:
      type: object
      required: [result, mode, started_at, finished_at, clean, summary, findings, findings_truncated]
      properties:
        result: { type: string, enum: [clean, warnings, violations] }
        mode: { type: string, enum: [summary] }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        clean: { type: boolean, description: True when no invariant violations exist; warnings may remain. }
        summary: { $ref: "#/components/schemas/IntegritySummary" }
        findings:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/IntegrityFinding" }
        findings_truncated: { type: boolean }
    IntegritySummary:
      type: object
      required: [violations, warnings, infos, pending_events, inflight_events, dead_events, active_ordered_events, ordered_streams, ready_streams, inflight_streams, blocked_streams, gap_streams, dead_blocked_streams, retry_wait_streams, stale_event_leases, ordering_partitions, owned_partitions, handoff_partitions, stale_relays, inbox_pending, inbox_inflight, inbox_retry_wait, inbox_processed, inbox_dead, inbox_stale_leases]
      properties:
        violations: { type: integer, format: int64, minimum: 0 }
        warnings: { type: integer, format: int64, minimum: 0 }
        infos: { type: integer, format: int64, minimum: 0 }
        pending_events: { type: integer, format: int64, minimum: 0 }
        inflight_events: { type: integer, format: int64, minimum: 0 }
        dead_events: { type: integer, format: int64, minimum: 0 }
        active_ordered_events: { type: integer, format: int64, minimum: 0 }
        ordered_streams: { type: integer, format: int64, minimum: 0 }
        ready_streams: { type: integer, format: int64, minimum: 0 }
        inflight_streams: { type: integer, format: int64, minimum: 0 }
        blocked_streams: { type: integer, format: int64, minimum: 0 }
        gap_streams: { type: integer, format: int64, minimum: 0 }
        dead_blocked_streams: { type: integer, format: int64, minimum: 0 }
        retry_wait_streams: { type: integer, format: int64, minimum: 0 }
        stale_event_leases: { type: integer, format: int64, minimum: 0 }
        ordering_partitions: { type: integer, format: int64, minimum: 0 }
        owned_partitions: { type: integer, format: int64, minimum: 0 }
        handoff_partitions: { type: integer, format: int64, minimum: 0 }
        stale_relays: { type: integer, format: int64, minimum: 0 }
        inbox_pending: { type: integer, format: int64, minimum: 0 }
        inbox_inflight: { type: integer, format: int64, minimum: 0 }
        inbox_retry_wait: { type: integer, format: int64, minimum: 0 }
        inbox_processed: { type: integer, format: int64, minimum: 0 }
        inbox_dead: { type: integer, format: int64, minimum: 0 }
        inbox_stale_leases: { type: integer, format: int64, minimum: 0 }
    IntegrityFinding:
      type: object
      required: [code, severity, message]
      properties:
        code:
          type: string
          enum: [SCHEMA_VERSION_MISMATCH, PARTITION_COUNT_INVALID, PARTITION_ID_INVALID, PARTITION_EPOCH_INVALID, PARTITION_LEASE_SHAPE_INVALID, PARTITION_OWNER_STALE, PARTITION_HANDOFF_OVERDUE, ORDERING_FIELDS_PARTIAL, ORDERING_PARTITION_MISMATCH, STREAM_PARTITION_MISMATCH, STREAM_CURSOR_INVALID, ACTIVE_SEQUENCE_BEHIND_CURSOR, EXPECTED_SEQUENCE_DUPLICATE, STREAM_GAP, STREAM_DEAD_BLOCKED, STREAM_RETRY_WAIT, STALE_EVENT_LEASE, RUNTIME_CONTROL_INVALID, RELAY_PRESENCE_STALE, INBOX_STATE_INVALID, INBOX_LEASE_SHAPE_INVALID, INBOX_SOURCE_METADATA_INVALID, INBOX_PROCESSED_TIMESTAMP_INVALID, INBOX_ATTEMPTS_INVALID, INBOX_STALE_LEASE, INBOX_DEAD_BLOCKED, INBOX_RETRY_WAIT]
        severity: { type: string, enum: [info, warning, violation] }
        message: { type: string }
        destination: { type: string }
        consumer: { type: string }
        event_id: { type: string, format: uuid }
        partition_id: { type: integer }
        source_partition: { type: integer, format: int32, minimum: 0 }
        expected: {}
        observed: {}
    Stats:
      type: object
      required: [paused, pending, pending_due, pending_scheduled, inflight, delivered_retained, dead, oldest_pending_seconds, active_relays, stale_relays, stopped_relays, ordered_streams, blocked_ordered_streams, gap_streams, dead_blocked_streams, owned_partitions, handoff_partitions]
      properties:
        paused: { type: boolean }
        pending: { type: integer, format: int64 }
        pending_due: { type: integer, format: int64 }
        pending_scheduled: { type: integer, format: int64 }
        inflight: { type: integer, format: int64 }
        delivered_retained: { type: integer, format: int64 }
        dead: { type: integer, format: int64 }
        oldest_pending_seconds: { type: number, minimum: 0 }
        active_relays: { type: integer, format: int64 }
        stale_relays: { type: integer, format: int64 }
        stopped_relays: { type: integer, format: int64 }
        ordered_streams: { type: integer, format: int64 }
        blocked_ordered_streams: { type: integer, format: int64 }
        gap_streams: { type: integer, format: int64 }
        dead_blocked_streams: { type: integer, format: int64 }
        owned_partitions: { type: integer, format: int64 }
        handoff_partitions: { type: integer, format: int64 }
    Event:
      type: object
      required: [id, destination, event_type, content_type, schema_version, status, attempts, available_at, created_at, payload_size]
      properties:
        id: { type: string, format: uuid }
        destination: { type: string }
        event_type: { type: string }
        content_type: { type: string }
        schema_version: { type: integer }
        correlation_id: { type: string }
        causation_id: { type: string }
        status: { type: string, enum: [pending, inflight, delivered, dead] }
        attempts: { type: integer }
        available_at: { type: string, format: date-time }
        lease_owner: { type: string }
        lease_until: { type: string, format: date-time }
        last_error: { type: string }
        created_at: { type: string, format: date-time }
        delivered_at: { type: string, format: date-time }
        payload_size: { type: integer, format: int64, minimum: 0 }
        replayed_from_event_id: { type: string, format: uuid }
        replay_batch_id: { type: string, format: uuid }
        ordering_key: { type: string }
        ordering_sequence: { type: integer, format: int64, minimum: 1 }
        ordering_partition: { type: integer, minimum: 0, maximum: 63 }
        message_key_base64: { type: string, contentEncoding: base64 }
        payload_base64: { type: string, contentEncoding: base64 }
        headers:
          type: object
          additionalProperties: { type: string }
    RelayInstance:
      type: object
      required: [instance_id, hostname, version, started_at, last_heartbeat_at, state, ordering_capable]
      properties:
        instance_id: { type: string }
        hostname: { type: string }
        version: { type: string }
        started_at: { type: string, format: date-time }
        last_heartbeat_at: { type: string, format: date-time }
        stopped_at: { type: string, format: date-time }
        state: { type: string, enum: [active, stale, stopped] }
        ordering_capable: { type: boolean }
    Control:
      type: object
      required: [paused, updated_at, updated_by]
      properties:
        paused: { type: boolean }
        reason: { type: string }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string }
    Mutation:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 4096, example: "operator recovery after incident" }
    RequiredMutation:
      allOf:
        - { $ref: "#/components/schemas/Mutation" }
        - type: object
          required: [reason]
    OrderedReplayMutation:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 4096 }
        ordering_mode:
          type: string
          enum: [unordered]
          description: Required acknowledgement when replaying an ordered source.
    ReplayFilter:
      type: object
      additionalProperties: false
      properties:
        destination: { type: string }
        event_type: { type: string }
        created_after: { type: string, format: date-time }
        created_before: { type: string, format: date-time }
        statuses:
          type: array
          items: { type: string, enum: [delivered, dead] }
        limit: { type: integer, minimum: 1, maximum: 1000, default: 1000 }
        reason: { type: string, minLength: 1, maxLength: 4096 }
        ordering_mode:
          type: string
          enum: [unordered]
          description: Required acknowledgement when the selection includes ordered sources.
    ReplayRequest:
      allOf:
        - { $ref: "#/components/schemas/ReplayFilter" }
        - type: object
          required: [reason]
    ReplayPreview:
      type: object
      required: [count, sample, execution_limit]
      properties:
        count: { type: integer }
        sample:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        execution_limit: { type: integer, maximum: 1000 }
    ReplayResult:
      type: object
      required: [replay_batch_id, created]
      properties:
        replay_batch_id: { type: string, format: uuid }
        created: { type: integer }
        event_ids:
          type: array
          items: { type: string, format: uuid }
    Audit:
      type: object
      required: [id, action, actor, details, created_at]
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        actor: { type: string }
        reason: { type: string }
        request_id: { type: string }
        target_event_id: { type: string, format: uuid }
        replay_batch_id: { type: string, format: uuid }
        details: { type: object }
        created_at: { type: string, format: date-time }
    OrderingStream:
      type: object
      required: [destination, ordering_key, partition, start_sequence, next_sequence, state, updated_at]
      properties:
        destination: { type: string }
        ordering_key: { type: string }
        partition: { type: integer, minimum: 0, maximum: 63 }
        start_sequence: { type: integer, format: int64, minimum: 1 }
        next_sequence: { type: integer, format: int64, minimum: 1 }
        state: { type: string, enum: [ready, inflight, retry_wait, gap, dead_blocked] }
        next_event_id: { type: string, format: uuid }
        next_event_status: { type: string, enum: [pending, inflight, delivered, dead] }
        next_event_attempts: { type: integer, minimum: 0 }
        lowest_future_sequence: { type: integer, format: int64, minimum: 1 }
        gap_size: { type: integer, format: int64, minimum: 0 }
        gap_age_seconds: { type: number, minimum: 0 }
        updated_at: { type: string, format: date-time }
    OrderingPartition:
      type: object
      required: [partition_id, epoch, state]
      properties:
        partition_id: { type: integer, minimum: 0, maximum: 63 }
        desired_owner: { type: string }
        actual_owner: { type: string }
        epoch: { type: integer, format: int64, minimum: 0 }
        lease_until: { type: string, format: date-time }
        handoff_not_before: { type: string, format: date-time }
        state: { type: string, enum: [owned, handoff, expired, unowned] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
