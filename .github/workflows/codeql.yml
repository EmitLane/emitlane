name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  analyze:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Detect analyzable Go project
        id: go_project
        run: |
          go_files="$(git ls-files -- '*.go' ':!vendor/**')"
          if [[ -f go.mod && -n "$go_files" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=CodeQL analysis pending::A Go module with tracked Go source does not exist yet; CodeQL initialization was not run."
          fi

      - name: Set up Go
        if: steps.go_project.outputs.exists == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: ${{ hashFiles('go.sum') != '' }}

      - name: Initialize CodeQL
        if: steps.go_project.outputs.exists == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: autobuild

      - name: Autobuild
        if: steps.go_project.outputs.exists == 'true'
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        if: steps.go_project.outputs.exists == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:go
