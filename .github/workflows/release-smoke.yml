name: Release container smoke

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - .github/workflows/release-smoke.yml
      - .goreleaser.yaml
      - Dockerfile.release
      - deploy/release/**
      - go.mod
      - go.sum
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: release container (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build release CLI
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "/tmp/emitlane-release-smoke/linux/$GOARCH"
          go build -trimpath -ldflags="-s -w -X main.version=smoke -X main.commit=$(git rev-parse HEAD)" \
            -o "/tmp/emitlane-release-smoke/linux/$GOARCH/emitlane" ./cmd/emitlane
          cp Dockerfile.release /tmp/emitlane-release-smoke/Dockerfile

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build candidate container
        env:
          SMOKE_ARCH: ${{ matrix.arch }}
        run: |
          docker buildx build --load --platform "linux/$SMOKE_ARCH" \
            --tag emitlane-release-smoke:local /tmp/emitlane-release-smoke

      - name: Run release CLI inside container
        env:
          SMOKE_ARCH: ${{ matrix.arch }}
        run: |
          actual="$(docker run --rm --network=none --platform "linux/$SMOKE_ARCH" \
            emitlane-release-smoke:local version)"
          printf '%s\n' "$actual"
          [[ "$actual" == *"smoke"* ]]
          [[ "$actual" == *"$(git rev-parse HEAD)"* ]]
          docker run --rm --network=none --platform "linux/$SMOKE_ARCH" \
            emitlane-release-smoke:local help

  snapshot:
    name: release snapshot artifacts
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record candidate and toolchain
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install pinned GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.0
          install-only: true

      - name: Build snapshot without publishing
        run: |
          set -euo pipefail
          git rev-parse HEAD
          test -z "$(git status --porcelain)"
          go version
          goreleaser check
          goreleaser release --snapshot --clean

      - name: Check source and packaged artifacts
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/emitlane-release-tools" go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$RUNNER_TEMP/emitlane-release-tools/govulncheck" -version
          "$RUNNER_TEMP/emitlane-release-tools/govulncheck" ./... | tee "$RUNNER_TEMP/emitlane-source-vulnerability.txt"
          python3 deploy/release/check-snapshot.py \
            --output "$RUNNER_TEMP/emitlane-snapshot-review" \
            --govulncheck "$RUNNER_TEMP/emitlane-release-tools/govulncheck"

      - name: Save snapshot evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emitlane-snapshot-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*.json
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            ${{ runner.temp }}/emitlane-source-vulnerability.txt
            ${{ runner.temp }}/emitlane-snapshot-review/
